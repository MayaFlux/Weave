name: Build Weave Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha256: ${{ steps.hash.outputs.SHA256 }}
      installer_path: ${{ steps.version.outputs.INSTALLER_PATH }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.1.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "INSTALLER_PATH=build/macos/Weave-${VERSION}.pkg" >> $GITHUB_OUTPUT

      - name: Setup Xcode (for Swift compilation)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        run: |
          echo "=== Swift Version ==="
          swift --version
          echo ""
          echo "=== Xcode SDK Path ==="
          xcrun --show-sdk-path
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Make scripts executable
        run: |
          chmod +x macos/scripts/create_pkg.sh
          chmod +x macos/scripts/build_weave_app.sh
          chmod +x macos/Weave.sh

      - name: Make verification scripts executable
        run: |
          chmod +x .github/scripts/verify-macos-build.sh
          chmod +x .github/scripts/generate-release-body.sh

      - name: Build installer package (includes Swift app)
        run: |
          ./macos/scripts/create_pkg.sh ${{ steps.version.outputs.VERSION }}

      - name: Verify build outputs
        run: |
          ./.github/scripts/verify-macos-build.sh ${{ steps.version.outputs.VERSION }}

      - name: Test Weave.app (smoke test)
        run: |
          echo "=== Testing Weave.app bundle structure ==="
          if [ ! -f "build/macos/WeaveApp/Weave.app/Contents/MacOS/Weave" ]; then
            echo "❌ Weave executable not found in app bundle"
            exit 1
          fi
          echo "✅ Weave executable exists"

          if [ ! -f "build/macos/WeaveApp/Weave.app/Contents/Info.plist" ]; then
            echo "❌ Info.plist not found"
            exit 1
          fi
          echo "✅ Info.plist exists"

          echo ""
          echo "=== Verifying code signature ==="
          codesign -vv build/macos/WeaveApp/Weave.app || echo "⚠️ Code signature verification failed (expected for ad-hoc signing)"

      - name: Generate SHA256 hash
        id: hash
        run: |
          SHA256=$(shasum -a 256 "${{ steps.version.outputs.INSTALLER_PATH }}" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weave-${{ steps.version.outputs.VERSION }}-macos
          path: ${{ steps.version.outputs.INSTALLER_PATH }}
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-${{ steps.version.outputs.VERSION }}-macos
          path: |
            build/macos/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha256: ${{ steps.hash.outputs.SHA256 }}
      installer_path: ${{ steps.version.outputs.INSTALLER_PATH }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: powershell
        run: |
          if ("$env:GITHUB_REF" -match "refs/tags/v(.+)") {
            $VERSION = $matches[1]
          } else {
            $SHORT_SHA = "$env:GITHUB_SHA".Substring(0, 7)
            $VERSION = "0.1.0-$SHORT_SHA"
          }
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_PATH=build/windows/Weave-$VERSION.exe" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify source files
        shell: powershell
        run: .\.github\scripts\verify-windows-files.ps1

      - name: Restore dependencies
        shell: powershell
        run: |
          dotnet restore windows\Weave.sln
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Build solution (Release x64)
        shell: powershell
        run: |
          dotnet build windows\Weave.sln `
            --configuration Release `
            -p:Platform=x64
          
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Verify templates directory
        shell: powershell
        run: |
          if (-not (Test-Path "templates")) {
            Write-Host "[ERROR] Templates directory not found" -ForegroundColor Red
            exit 1
          }
          $templateCount = @(Get-ChildItem "templates" -Recurse).Count
          Write-Host "[OK] Templates directory found with $templateCount items" -ForegroundColor Green

      - name: Create distribution package
        shell: powershell
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $buildDir = "build\windows"
          $releaseDir = "windows\Weave\bin\x64\Release\net8.0-windows\win-x64"
          
          if (-not (Test-Path $releaseDir)) {
            Write-Host "[ERROR] Release directory not found" -ForegroundColor Red
            exit 1
          }
          
          if (-not (Test-Path $buildDir)) {
            New-Item -ItemType Directory -Path $buildDir | Out-Null
          }
          
          # Copy exe
          Copy-Item "$releaseDir\Weave.exe" -Destination "$buildDir\Weave.exe" -Force
          
          # Copy scripts from source
          Copy-Item "windows\scripts\install_package.ps1" -Destination "$buildDir\install_package.ps1" -Force
          Copy-Item "windows\scripts\packages.psd1" -Destination "$buildDir\packages.psd1" -Force
          
          Write-Host "[OK] Distribution package created" -ForegroundColor Green
      - name: Rename for distribution
        shell: powershell
        run: |
          $buildDir = "build\windows"
          $version = "${{ steps.version.outputs.VERSION }}"
          $source = Join-Path $buildDir "Weave.exe"
          $dest = Join-Path $buildDir "Weave-$version.exe"
          
          Move-Item $source $dest -Force

      - name: Verify build
        shell: powershell
        run: .\.github\scripts\verify-windows-build.ps1 -Version "${{ steps.version.outputs.VERSION }}"
      - name: Generate SHA256 hash
        id: hash
        shell: powershell
        run: |
          $hash = (Get-FileHash "${{ steps.version.outputs.INSTALLER_PATH }}" -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weave-${{ steps.version.outputs.VERSION }}-windows
          path: ${{ steps.version.outputs.INSTALLER_PATH }}
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-${{ steps.version.outputs.VERSION }}-windows
          path: |
            build/windows/
            windows/Weave/bin/Release/
          retention-days: 7

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Weave-${{ needs.build-macos.outputs.version }}-macos
          path: ./packages/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Weave-${{ needs.build-windows.outputs.version }}-windows
          path: ./packages/windows

      - name: Verify artifacts
        run: |
          echo "=== macOS Artifact ==="
          ls -lh ./packages/macos/ || echo "No macOS artifact"
          echo ""
          echo "=== Windows Artifact ==="
          ls -lh ./packages/windows/ || echo "No Windows artifact"
          echo ""

          # Check that we have both artifacts
          if [ ! -f "./packages/macos/Weave-${{ needs.build-macos.outputs.version }}.pkg" ]; then
            echo "❌ macOS artifact not found!"
            exit 1
          fi

          if [ ! -f "./packages/windows/Weave-${{ needs.build-windows.outputs.version }}.exe" ]; then
            echo "❌ Windows artifact not found!"
            exit 1
          fi

      - name: Generate release body
        id: generate_release_body
        run: |
          # Generate release body from template
          ./.github/scripts/generate-release-body.sh \
            --version "${{ needs.build-macos.outputs.version }}" \
            --macos-sha256 "${{ needs.build-macos.outputs.sha256 }}" \
            --windows-sha256 "${{ needs.build-windows.outputs.sha256 }}" \
            --output release-body.md

          echo "Generated release body:"
          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/macos/Weave-*.pkg
            packages/windows/Weave-*.exe
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
