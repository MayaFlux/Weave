name: Build, test, and publish Weave

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build, test, package, and validate Rust on macOS
        type: boolean
        default: true
      windows:
        description: Build, test, package, and validate Rust on Windows
        type: boolean
        default: true
      linux:
        description: Build, test, package, and validate Rust on Linux
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release policy and publishing with controlled commands
        run: bash tests/release.sh

  build-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-26.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-latest
    steps:
      - name: Select platform for this run
        id: platform-selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_MACOS: ${{ inputs.macos }}
          BUILD_WINDOWS: ${{ inputs.windows }}
          BUILD_LINUX: ${{ inputs.linux }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || \
            { [ "$PLATFORM" = "macos" ] && [ "$BUILD_MACOS" = "true" ]; } || \
            { [ "$PLATFORM" = "windows" ] && [ "$BUILD_WINDOWS" = "true" ]; } || \
            { [ "$PLATFORM" = "linux" ] && [ "$BUILD_LINUX" = "true" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Weave
        if: steps.platform-selection.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Rust
        if: steps.platform-selection.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        if: steps.platform-selection.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI build dependencies
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxcursor-dev libfontconfig1-dev libfreetype-dev file binutils

      - name: Cache Linux AppImage packaging tools
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: target/packaging/linux/tools
          key: weave-linux-appimage-tools-x86_64-v1

      - name: Test Rust application
        if: steps.platform-selection.outputs.enabled == 'true'
        run: cargo test --locked

      - name: Build Rust application
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        run: cargo build --release --locked

      - name: Package self-contained Windows x64 executable
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/scripts/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/weave-windows"

      - name: Validate Windows portable package
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/weave-windows" -Filter 'Weave-*-Windows-x64.zip'
          if (@($package).Count -ne 1) { throw 'Expected exactly one Windows portable package.' }
          ./packaging/windows/scripts/verify.ps1 -Package $package.FullName

      - name: Test Windows package rejection paths
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/weave-windows" -Filter 'Weave-*-Windows-x64.zip'
          ./tests/windows-package.ps1 -Package $package.FullName

      - name: Upload Windows portable package
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Weave-windows-x64
          path: ${{ runner.temp }}/weave-windows/Weave-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Package Linux AppImage
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        run: bash packaging/linux/scripts/package.sh "$RUNNER_TEMP/weave-linux"

      - name: Validate Linux AppImage
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        run: bash packaging/linux/scripts/verify.sh "$RUNNER_TEMP"/weave-linux/Weave-*-Linux-x86_64.AppImage

      - name: Upload Linux AppImage
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Weave-linux-x86_64
          path: ${{ runner.temp }}/weave-linux/Weave-*-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Install Apple Silicon Rust target
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Package macOS app and DMG
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: bash packaging/macos/scripts/package.sh "$RUNNER_TEMP/weave-macos"

      - name: Validate macOS DMG
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: bash packaging/macos/scripts/verify.sh "$RUNNER_TEMP"/weave-macos/Weave-*-macOS-arm64.dmg

      - name: Upload macOS package
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Weave-macos-arm64
          path: ${{ runner.temp }}/weave-macos/Weave-*-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [test-release, build-rust]
    # Selective manual builds still upload their artifacts, but never publish
    # a release that is missing another platform's package.
    if: >-
      needs.test-release.result == 'success' && needs.build-rust.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || (inputs.macos && inputs.windows && inputs.linux))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: weave-release-publishing
      cancel-in-progress: false
    steps:
      - name: Check out the exact built commit and version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download validated platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Weave-*
          merge-multiple: true
          path: ${{ runner.temp }}/weave-packages

      - name: Assemble release assets, current instructions, and SHA256 checksums
        run: bash packaging/scripts/release.sh assemble "$RUNNER_TEMP/weave-packages" "$RUNNER_TEMP/weave-release"

      - name: Publish stable or rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/scripts/release.sh publish "$RUNNER_TEMP/weave-release"
