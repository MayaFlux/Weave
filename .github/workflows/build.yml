name: Build and test Weave

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build, test, package, and validate Rust on macOS
        type: boolean
        default: true
      windows:
        description: Build and test Rust on Windows
        type: boolean
        default: true
      linux:
        description: Build and test Rust on Linux
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-latest
    steps:
      - name: Select platform for this run
        id: platform-selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_MACOS: ${{ inputs.macos }}
          BUILD_WINDOWS: ${{ inputs.windows }}
          BUILD_LINUX: ${{ inputs.linux }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || \
            { [ "$PLATFORM" = "macos" ] && [ "$BUILD_MACOS" = "true" ]; } || \
            { [ "$PLATFORM" = "windows" ] && [ "$BUILD_WINDOWS" = "true" ]; } || \
            { [ "$PLATFORM" = "linux" ] && [ "$BUILD_LINUX" = "true" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Weave
        if: steps.platform-selection.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Rust
        if: steps.platform-selection.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxcursor-dev

      - name: Test Rust application
        if: steps.platform-selection.outputs.enabled == 'true'
        run: cargo test --locked

      - name: Build Rust application
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Install Apple Silicon Rust target
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Package macOS app and DMG
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: bash macos/scripts/package_weave_macos.sh "$RUNNER_TEMP/weave-macos"

      - name: Validate macOS DMG
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        run: bash macos/scripts/verify_weave_macos_package.sh "$RUNNER_TEMP"/weave-macos/Weave-*-macOS-arm64.dmg

      - name: Upload macOS package
        if: steps.platform-selection.outputs.enabled == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Weave-macos-arm64
          path: ${{ runner.temp }}/weave-macos/Weave-*-macOS-arm64.dmg
          if-no-files-found: error
