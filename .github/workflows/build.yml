name: Build Weave Installers

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build macOS
        type: boolean
        default: true
      windows:
        description: Build Windows
        type: boolean
        default: true
      linux:
        description: Build Linux
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxcursor-dev

      - name: Test Rust application and project creation
        run: cargo test --locked

      - name: Build Rust application
        run: cargo build --release --locked

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-26
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Xcode (for Swift compilation)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        run: |
          echo "=== Swift Version ==="
          swift --version
          echo ""
          echo "=== Xcode SDK Path ==="
          xcrun --show-sdk-path
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Make scripts executable
        run: |
          chmod +x macos/scripts/build_weave_app.sh
          chmod +x macos/Weave.sh

      - name: Make verification scripts executable
        run: |
          chmod +x .github/scripts/verify-macos-build.sh
          chmod +x .github/scripts/generate-release-body.sh
          chmod +x tests/macos/integration/test_packaged_app.sh

      - name: Test macOS unit suite
        run: |
          xcodebuild test \
            -project macos/Weave.xcodeproj \
            -scheme Weave \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Weave.app
        run: |
          mkdir -p build/macos
          ./macos/scripts/build_weave_app.sh

      - name: Sign Weave.app (ad-hoc)
        run: |
          codesign --sign - --deep --force --options runtime \
            build/macos/WeaveApp/Weave.app

      - name: Test packaged macOS artifact
        run: |
          ./tests/macos/integration/test_packaged_app.sh \
            build/macos/WeaveApp/Weave.app

      - name: Verify build outputs
        run: |
          ./.github/scripts/verify-macos-build.sh

      - name: Install DMG tooling
        run: |
          BREW_EXECUTABLE="$(command -v brew || true)"
          if [ -z "$BREW_EXECUTABLE" ]; then
            echo "Homebrew was not found on the macOS runner PATH." >&2
            exit 1
          fi
          "$BREW_EXECUTABLE" install create-dmg

      - name: Create DMG
        run: |
          DMG_WORK="$(mktemp -d "${RUNNER_TEMP}/weave-dmg.XXXXXX")"
          DMG_ROOT="$DMG_WORK/source"
          mkdir -p "$DMG_ROOT"
          trap 'rm -rf "$DMG_WORK"' EXIT
          cp -R "build/macos/WeaveApp/Weave.app" "$DMG_ROOT/Weave.app"
          swift macos/scripts/create_dmg_background.swift "$DMG_WORK/background.png"
          BREW_EXECUTABLE="$(command -v brew)"
          CREATE_DMG_EXECUTABLE="$("$BREW_EXECUTABLE" --prefix create-dmg)/bin/create-dmg"
          "$CREATE_DMG_EXECUTABLE" \
            --volname "Weave" \
            --volicon "macos/resources/weave.icns" \
            --background "$DMG_WORK/background.png" \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Weave.app" 200 200 \
            --hide-extension "Weave.app" \
            --app-drop-link 600 200 \
            --format UDZO \
            --overwrite \
            "build/macos/Weave.dmg" \
            "$DMG_ROOT"

      - name: Generate SHA256 hash
        id: hash
        run: |
          SHA256=$(shasum -a 256 "build/macos/Weave.dmg" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-macos
          path: build/macos/Weave.dmg
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-macos
          path: build/macos/
          retention-days: 7

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify source files
        shell: powershell
        run: .\.github\scripts\verify-windows-files.ps1

      - name: Restore NuGet dependencies
        shell: powershell
        run: |
          dotnet restore windows\Weave.sln -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build solution
        shell: powershell
        run: |
          dotnet build windows\Weave.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test Windows unit suite
        shell: powershell
        run: |
          dotnet test tests/windows/unit/Weave.Windows.UnitTests.csproj -c Release -p:Platform=x64 --logger "trx;LogFileName=windows-unit.trx" --results-directory build/windows/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows-unit-results
          path: build/windows/test-results/*.trx
          if-no-files-found: ignore

      - name: Publish executable
        shell: powershell
        run: |
          dotnet publish windows/Weave/Weave.csproj -c Release -p:Platform=x64 -p:PublishSingleFile=true -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create distribution package
        shell: powershell
        run: |
          $publishDir = "windows/Weave/bin/x64/Release/net8.0-windows/win-x64/publish"
          $stagingDir = "build/windows/staging"

          if (-not (Test-Path "$publishDir/Weave.exe")) {
            Write-Host "ERROR: Weave.exe not found at $publishDir"
            Get-ChildItem -Path "windows/Weave/bin" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
            exit 1
          }

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "$publishDir/Weave.exe" -Destination "$stagingDir/Weave.exe" -Force

          Write-Host ""
          Write-Host "Distribution package contents:"
          Get-ChildItem -Path $stagingDir -Recurse | Select-Object FullName

      - name: Create ZIP
        shell: powershell
        run: |
          $stagingDir = "build/windows/staging"
          $zipPath = "build/windows/Weave.zip"

          # Get all items in staging directory
          $items = Get-ChildItem -Path $stagingDir -Force

          if ($items.Count -eq 0) {
            Write-Host "ERROR: Staging directory is empty!"
            exit 1
          }

          Write-Host "INFO: Compressing $(if ($items -is [array]) { $items.Count } else { 1 }) items"

          # Compress the items
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath -Force
          $zipMB = [Math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "INFO: ZIP created - size is $zipMB MB"

          # List ZIP contents to verify
          Write-Host ""
          Write-Host "ZIP contents (first 20 entries):"
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $zip.Entries | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
          $zip.Dispose()

      - name: Test packaged Windows artifact
        shell: powershell
        run: .\.github\scripts\verify-windows-build.ps1

      - name: Upload Windows integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows-integration-results
          path: build/windows/test-results/windows-integration.trx
          if-no-files-found: ignore

      - name: Generate hash
        id: hash
        shell: powershell
        run: |
          $zipPath = "build/windows/Weave.zip"
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows
          path: build/windows/Weave.zip
          retention-days: 30

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Verify source files
        run: bash .github/scripts/verify-linux-files.sh

      - name: Test Linux source
        run: python3 -m unittest discover -s tests/linux -p 'test_*.py' -v

      - name: Make build script executable
        run: chmod +x linux/scripts/build_appimage.sh

      - name: Build AppImage
        run: bash linux/scripts/build_appimage.sh

      - name: Verify build output
        run: bash .github/scripts/verify-linux-build.sh

      - name: Test AppImage integration
        run: python3 -m unittest discover -s tests/linux/integration -p 'test_*.py' -v

      - name: Test AppImage runtime without host GUI libraries
        run: |
          podman run --rm --pull=never --network none \
            -v "$PWD:/workspace:ro" -w /workspace \
            ubuntu:25.10 bash -euc '
              test ! -e /usr/lib/x86_64-linux-gnu/libgtk-4.so.1
              test ! -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
              test ! -e /usr/lib/x86_64-linux-gnu/libGL.so.1
              image="$(find /workspace/build/linux -maxdepth 1 -type f -name "Weave-*.AppImage" -print -quit)"
              test -n "$image"
              extract_dir="$(mktemp -d)"
              cd "$extract_dir"
              "$image" --appimage-extract >/dev/null
              export PYTHONHOME="$extract_dir/squashfs-root/usr"
              export LD_LIBRARY_PATH="$extract_dir/squashfs-root/usr/lib"
              export WEAVE_APPIMAGE="$image"
              "$extract_dir/squashfs-root/usr/bin/python3" -m unittest discover \
                -s /workspace/tests/linux/integration -p "test_*.py" \
                -k test_bundled_python_imports_application_and_bundled_gtk -v
            '

      - name: Generate SHA256 hash
        id: hash
        run: |
          APPIMAGE=$(find build/linux -name "Weave-*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "Error: AppImage not found in build/linux"
            ls -la build/linux/
            exit 1
          fi
          SHA256=$(sha256sum "$APPIMAGE" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-linux
          path: build/linux/Weave-*.AppImage
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-linux
          path: build/linux/
          retention-days: 7

  publish-release:
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          clean: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-macos
          path: ./packages/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-linux
          path: ./packages/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-windows
          path: ./packages/windows

      - name: Determine release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main branch = Release build
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for release build"
              exit 1
            fi
            
            # Ensure the tag doesn't have -dev suffix for release
            VERSION=${LATEST_TAG#v}
            VERSION=${VERSION%-dev}
            IS_RELEASE=true

          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Triggered ON a tag directly
            VERSION=${GITHUB_REF#refs/tags/v}
            if [[ "$VERSION" != *-dev ]]; then
              IS_RELEASE=true
            else
              IS_RELEASE=false
            fi

          else
            # Branch push / workflow_dispatch = Dev build
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev$' | head -1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for dev build"
              exit 1
            fi
            VERSION=${LATEST_TAG#v}
            if [[ "$VERSION" != *-dev ]]; then
              VERSION="$VERSION-dev"
            fi
            IS_RELEASE=false
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (is_release=$IS_RELEASE)"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f "v$VERSION" "${GITHUB_SHA}"
          git push -f origin "v$VERSION"

      - name: Rename artifacts for release
        run: |
          mkdir -p ./release

          # macOS DMG
          if [ ! -f "./packages/macos/Weave.dmg" ]; then
            echo "Error: macOS DMG not found"
            exit 1
          fi
          cp "./packages/macos/Weave.dmg" "./release/Weave-macos.dmg"

          # Linux
          LINUX_APPIMAGE=$(find ./packages/linux -name "Weave-*.AppImage" | head -1)
          if [ -z "$LINUX_APPIMAGE" ]; then
            echo "Error: Linux AppImage not found"
            exit 1
          fi
          cp "$LINUX_APPIMAGE" "./release/Weave-linux.AppImage"
          chmod +x "./release/Weave-linux.AppImage"

          # Windows
          WINDOWS_ZIP=$(find ./packages/windows -name "Weave.zip" | head -1)
          if [ -z "$WINDOWS_ZIP" ]; then
            echo "Error: Windows artifact not found"
            exit 1
          fi
          cp "$WINDOWS_ZIP" "./release/Weave-windows.zip"

      - name: Generate release body
        id: generate_release_body
        run: |
          chmod +x ./.github/scripts/generate-release-body.sh
          ./.github/scripts/generate-release-body.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --macos-sha256 "${{ needs.build-macos.outputs.sha256 }}" \
            --linux-sha256 "${{ needs.build-linux.outputs.sha256 }}" \
            --windows-sha256 "${{ needs.build-windows.outputs.sha256 }}" \
            --output release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.IS_RELEASE == 'true' && format('v{0}',
            steps.version.outputs.VERSION) || format('v{0}',
            steps.version.outputs.VERSION) }}
          files: |
            release/Weave-macos.dmg
            release/Weave-linux.AppImage
            release/Weave-windows.zip
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_RELEASE == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
