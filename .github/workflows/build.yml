name: Build and test Weave

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build and test Rust on macOS
        type: boolean
        default: true
      windows:
        description: Build and test Rust on Windows
        type: boolean
        default: true
      linux:
        description: Build and test Rust on Linux
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-rust:
    if: ${{ github.event_name != 'workflow_dispatch' || (matrix.platform == 'macos' && inputs.macos) || (matrix.platform == 'windows' && inputs.windows) || (matrix.platform == 'linux' && inputs.linux) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-latest
    steps:
      - name: Check out Weave
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxcursor-dev

      - name: Test Rust application
        run: cargo test --locked

      - name: Build Rust application
        run: cargo build --release --locked
