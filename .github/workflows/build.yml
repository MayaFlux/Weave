name: Build Weave Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Xcode (for Swift compilation)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        run: |
          echo "=== Swift Version ==="
          swift --version
          echo ""
          echo "=== Xcode SDK Path ==="
          xcrun --show-sdk-path
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Make scripts executable
        run: |
          chmod +x macos/scripts/build_weave_app.sh
          chmod +x macos/Weave.sh

      - name: Make verification scripts executable
        run: |
          chmod +x .github/scripts/verify-macos-build.sh
          chmod +x .github/scripts/generate-release-body.sh

      - name: Build Weave.app
        run: |
          mkdir -p build/macos
          ./macos/scripts/build_weave_app.sh

      - name: Sign Weave.app (ad-hoc)
        run: |
          codesign --sign - --deep --force --options runtime \
            build/macos/WeaveApp/Weave.app

      - name: Verify build outputs
        run: |
          ./.github/scripts/verify-macos-build.sh

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Weave" \
            -srcfolder "build/macos/WeaveApp/Weave.app" \
            -ov -format UDZO \
            "build/macos/Weave.dmg"

      - name: Generate SHA256 hash
        id: hash
        run: |
          SHA256=$(shasum -a 256 "build/macos/Weave.dmg" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-macos
          path: build/macos/Weave.dmg
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-macos
          path: build/macos/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify source files
        shell: powershell
        run: .\.github\scripts\verify-windows-files.ps1

      - name: Restore NuGet dependencies
        shell: powershell
        run: |
          dotnet restore windows\Weave.sln -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build solution
        shell: powershell
        run: |
          dotnet build windows\Weave.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish executable
        shell: powershell
        run: |
          dotnet publish windows/Weave/Weave.csproj -c Release -p:Platform=x64 -p:PublishSingleFile=true -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify executable size
        shell: powershell
        run: |
          $exePath = "windows/Weave/bin/x64/Release/net8.0-windows/win-x64/publish/Weave.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "FAIL: Executable not found at $exePath"
            exit 1
          }
          $sizeMB = [Math]::Round((Get-Item $exePath).Length / 1MB, 1)
          Write-Host "INFO: Weave.exe size is $sizeMB MB (need 140+ MB)"
          if ($sizeMB -lt 100) {
            Write-Host "FAIL: Executable too small - resources not embedded"
            exit 1
          }

      - name: Create distribution package
        shell: powershell
        run: |
          $publishDir = "windows/Weave/bin/x64/Release/net8.0-windows/win-x64/publish"
          $stagingDir = "build/windows/staging"

          if (-not (Test-Path "$publishDir/Weave.exe")) {
            Write-Host "ERROR: Weave.exe not found at $publishDir"
            Get-ChildItem -Path "windows/Weave/bin" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
            exit 1
          }

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "$publishDir/Weave.exe" -Destination "$stagingDir/Weave.exe" -Force

          Write-Host ""
          Write-Host "Distribution package contents:"
          Get-ChildItem -Path $stagingDir -Recurse | Select-Object FullName

      - name: Create ZIP
        shell: powershell
        run: |
          $stagingDir = "build/windows/staging"
          $zipPath = "build/windows/Weave.zip"

          # Get all items in staging directory
          $items = Get-ChildItem -Path $stagingDir -Force

          if ($items.Count -eq 0) {
            Write-Host "ERROR: Staging directory is empty!"
            exit 1
          }

          Write-Host "INFO: Compressing $(if ($items -is [array]) { $items.Count } else { 1 }) items"

          # Compress the items
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath -Force
          $zipMB = [Math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "INFO: ZIP created - size is $zipMB MB"

          # List ZIP contents to verify
          Write-Host ""
          Write-Host "ZIP contents (first 20 entries):"
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $zip.Entries | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
          $zip.Dispose()

      - name: Generate hash
        id: hash
        shell: powershell
        run: |
          $zipPath = "build/windows/Weave.zip"
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows
          path: build/windows/Weave.zip
          retention-days: 30

      - name: Verify Windows build (before upload)
        shell: powershell
        run: .\.github\scripts\verify-windows-build.ps1

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Verify source files
        run: bash .github/scripts/verify-linux-files.sh

      - name: Make build script executable
        run: chmod +x linux/scripts/build_appimage.sh

      - name: Build AppImage
        run: bash linux/scripts/build_appimage.sh

      - name: Verify build output
        run: bash .github/scripts/verify-linux-build.sh

      - name: Generate SHA256 hash
        id: hash
        run: |
          APPIMAGE=$(find build/linux -name "Weave-*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "Error: AppImage not found in build/linux"
            ls -la build/linux/
            exit 1
          fi
          SHA256=$(sha256sum "$APPIMAGE" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-linux
          path: build/linux/Weave-*.AppImage
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-linux
          path: build/linux/
          retention-days: 7

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          clean: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-macos
          path: ./packages/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-linux
          path: ./packages/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-windows
          path: ./packages/windows

      - name: Determine release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main branch = Release build
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for release build"
              exit 1
            fi
            
            # Ensure the tag doesn't have -dev suffix for release
            VERSION=${LATEST_TAG#v}
            VERSION=${VERSION%-dev}
            IS_RELEASE=true

          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Triggered ON a tag directly
            VERSION=${GITHUB_REF#refs/tags/v}
            if [[ "$VERSION" != *-dev ]]; then
              IS_RELEASE=true
            else
              IS_RELEASE=false
            fi

          else
            # Branch push / workflow_dispatch = Dev build
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev$' | head -1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for dev build"
              exit 1
            fi
            VERSION=${LATEST_TAG#v}
            if [[ "$VERSION" != *-dev ]]; then
              VERSION="$VERSION-dev"
            fi
            IS_RELEASE=false
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (is_release=$IS_RELEASE)"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f "v$VERSION" "${GITHUB_SHA}"
          git push -f origin "v$VERSION"

      - name: Rename artifacts for release
        run: |
          mkdir -p ./release

          # macOS DMG
          if [ ! -f "./packages/macos/Weave.dmg" ]; then
            echo "Error: macOS DMG not found"
            exit 1
          fi
          cp "./packages/macos/Weave.dmg" "./release/Weave-macos.dmg"

          # Linux
          LINUX_APPIMAGE=$(find ./packages/linux -name "Weave-*.AppImage" | head -1)
          if [ -z "$LINUX_APPIMAGE" ]; then
            echo "Error: Linux AppImage not found"
            exit 1
          fi
          cp "$LINUX_APPIMAGE" "./release/Weave-linux.AppImage"
          chmod +x "./release/Weave-linux.AppImage"

          # Windows
          WINDOWS_ZIP=$(find ./packages/windows -name "Weave.zip" | head -1)
          if [ -z "$WINDOWS_ZIP" ]; then
            echo "Error: Windows artifact not found"
            exit 1
          fi
          cp "$WINDOWS_ZIP" "./release/Weave-windows.zip"

      - name: Generate release body
        id: generate_release_body
        run: |
          chmod +x ./.github/scripts/generate-release-body.sh
          ./.github/scripts/generate-release-body.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --macos-sha256 "${{ needs.build-macos.outputs.sha256 }}" \
            --linux-sha256 "${{ needs.build-linux.outputs.sha256 }}" \
            --windows-sha256 "${{ needs.build-windows.outputs.sha256 }}" \
            --output release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.IS_RELEASE == 'true' && format('v{0}',
            steps.version.outputs.VERSION) || format('v{0}',
            steps.version.outputs.VERSION) }}
          files: |
            release/Weave-macos.dmg
            release/Weave-linux.AppImage
            release/Weave-windows.zip
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_RELEASE == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
