name: Build Weave Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Xcode (for Swift compilation)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        run: |
          echo "=== Swift Version ==="
          swift --version
          echo ""
          echo "=== Xcode SDK Path ==="
          xcrun --show-sdk-path
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Make scripts executable
        run: |
          chmod +x macos/scripts/create_pkg.sh
          chmod +x macos/scripts/build_weave_app.sh
          chmod +x macos/Weave.sh

      - name: Make verification scripts executable
        run: |
          chmod +x .github/scripts/verify-macos-build.sh
          chmod +x .github/scripts/generate-release-body.sh

      - name: Build installer package
        run: |
          mkdir -p build/macos
          ./macos/scripts/create_pkg.sh

      - name: Verify build outputs
        run: |
          ./.github/scripts/verify-macos-build.sh

      - name: Test Weave.app (smoke test)
        run: |
          echo "=== Testing Weave.app bundle structure ==="
          if [ ! -f "build/macos/WeaveApp/Weave.app/Contents/MacOS/Weave" ]; then
            echo "❌ Weave executable not found in app bundle"
            exit 1
          fi
          echo "✅ Weave executable exists"

          if [ ! -f "build/macos/WeaveApp/Weave.app/Contents/Info.plist" ]; then
            echo "❌ Info.plist not found"
            exit 1
          fi
          echo "✅ Info.plist exists"

      - name: Create Weave.app standalone archive
        run: |
          cd build/macos
          mv WeaveApp/Weave.app WeaveProjects.app
          echo "Created Weave.app standalone archive"

      - name: Verify universal binary
        run: |
          echo "=== Verifying Universal Binary ==="
          BINARY="build/macos/WeaveProjects.app/Contents/MacOS/Weave"
          if [ ! -f "$BINARY" ]; then
            echo "❌ Weave binary not found"
            exit 1
          fi

          ARCHITECTURES=$(lipo -info "$BINARY")
          echo "Architectures: $ARCHITECTURES"

          if [[ "$ARCHITECTURES" != *"x86_64"* ]]; then
            echo "❌ Missing x86_64 (Intel) architecture"
            exit 1
          fi

          if [[ "$ARCHITECTURES" != *"arm64"* ]]; then
            echo "❌ Missing arm64 (Apple Silicon) architecture"
            exit 1
          fi

          echo "✅ Universal binary contains both x86_64 and arm64"

      - name: Generate SHA256 hash
        id: hash
        run: |
          FINAL_PKG=$(find build/macos -name "Weave-*.pkg" -type f | head -1)
          if [ -z "$FINAL_PKG" ]; then
            echo "Error: No final .pkg file found in build/macos"
            exit 1
          fi
          SHA256=$(shasum -a 256 "$FINAL_PKG" | cut -d ' ' -f 1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "PKG_PATH=$FINAL_PKG" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-macos
          path: |
            build/macos/Weave-*.pkg
            build/macos/WeaveStep-*.pkg
            build/macos/WeaveProjects.app
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-macos
          path: build/macos/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.hash.outputs.SHA256 }}
    steps:
      - name: Checkout Weave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify source files
        shell: powershell
        run: .\.github\scripts\verify-windows-files.ps1

      - name: Restore dependencies
        shell: powershell
        run: |
          dotnet restore windows\Weave.sln
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Build solution (Release x64)
        shell: powershell
        run: |
          dotnet build windows\Weave.sln `
            --configuration Release `
            -p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Verify templates directory
        shell: powershell
        run: |
          if (-not (Test-Path "templates")) {
            Write-Host "Error: Templates directory not found"
            exit 1
          }
          $templateCount = @(Get-ChildItem "templates" -Recurse).Count
          Write-Host "OK: Templates directory found with $templateCount items"

      - name: Create distribution package
        shell: powershell
        run: |
          $buildDir = "build\windows"
          $releaseDir = "windows\Weave\bin\x64\Release\net8.0-windows\win-x64"

          if (-not (Test-Path $releaseDir)) {
            Write-Host "Error: Release directory not found"
            exit 1
          }

          if (-not (Test-Path $buildDir)) {
            New-Item -ItemType Directory -Path $buildDir | Out-Null
          }

          # Create staging directory for all files
          $stagingDir = "$buildDir\staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Copy exe
          Copy-Item "$releaseDir\Weave.exe" -Destination "$stagingDir\Weave.exe" -Force

          # Copy scripts from source
          Copy-Item "windows\scripts\install_package.ps1" -Destination "$stagingDir\install_package.ps1" -Force
          Copy-Item "windows\scripts\packages.psd1" -Destination "$stagingDir\packages.psd1" -Force

          # Copy templates directory
          if (Test-Path "templates") {
            Copy-Item "templates" -Destination "$stagingDir\templates" -Recurse -Force
          }

      - name: Create ZIP archive
        shell: powershell
        run: |
          $buildDir = "build\windows"
          $stagingDir = "$buildDir\staging"
          $zipPath = "$buildDir\Weave.zip"

          Compress-Archive -Path $stagingDir -DestinationPath $zipPath -Force

      - name: Verify build
        shell: powershell
        run: .\.github\scripts\verify-windows-build.ps1

      - name: Generate SHA256 hash
        id: hash
        shell: powershell
        run: |
          $zipPath = "build\windows\Weave.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "Error: ZIP file not found at $zipPath"
            exit 1
          }
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows
          path: build/windows/Weave.zip
          retention-days: 30

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-windows
          path: |
            build/windows/
            windows/Weave/bin/Release/
          retention-days: 7

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          clean: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-macos
          path: ./packages/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-windows
          path: ./packages/windows

      - name: Determine release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main branch = Release build
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for release build"
              exit 1
            fi
            
            # Ensure the tag doesn't have -dev suffix for release
            VERSION=${LATEST_TAG#v}
            VERSION=${VERSION%-dev}
            IS_RELEASE=true
            
            echo "Release build for version: $VERSION"
            
            # CREATE THE STABLE TAG for the release
            echo "Creating stable release tag: v$VERSION"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag "v$VERSION" "${GITHUB_SHA}"
            git push origin "v$VERSION"
            
          else
            # Non-main branch = Dev build
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$LATEST_TAG" ]]; then
              echo "Error: No existing tag found for dev build"
              exit 1
            fi
            
            # Use the latest tag but ensure it has -dev suffix
            VERSION=${LATEST_TAG#v}
            if [[ "$VERSION" != *-dev ]]; then
              VERSION="$VERSION-dev"
            fi
            IS_RELEASE=false

            echo "Preparing dev tag: v$VERSION -> ${GITHUB_SHA}"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            git tag -f "v$VERSION" "${GITHUB_SHA}"
            git push -f origin "v$VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_OUTPUT

      - name: Rename artifacts for release
        run: |
          mkdir -p ./release

          # macOS PKG
          MACOS_PKG=$(find ./packages/macos -name "Weave-*.pkg" | head -1)
          if [ -z "$MACOS_PKG" ]; then
            echo "Error: macOS package not found"
            exit 1
          fi
          cp "$MACOS_PKG" "./release/Weave-installer-macos.pkg"

          # macOS App
          MACOS_APP=$(find ./packages/macos -name "WeaveProjects.app" | head -1)
          if [ -n "$MACOS_APP" ]; then
            cp "$MACOS_APP" "./release/Weave-project-macos.app"
          fi

          # Windows
          WINDOWS_ZIP=$(find ./packages/windows -name "Weave.zip" | head -1)
          if [ -z "$WINDOWS_ZIP" ]; then
            echo "Error: Windows artifact not found"
            exit 1
          fi
          cp "$WINDOWS_ZIP" "./release/Weave-windows.zip"

      - name: Generate release body
        id: generate_release_body
        run: |
          chmod +x ./.github/scripts/generate-release-body.sh
          ./.github/scripts/generate-release-body.sh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --macos-sha256 "${{ needs.build-macos.outputs.sha256 }}" \
            --windows-sha256 "${{ needs.build-windows.outputs.sha256 }}" \
            --output release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.IS_RELEASE == 'true' && format('v{0}', steps.version.outputs.VERSION) || format('v{0}', steps.version.outputs.VERSION) }}
          files: |
            release/Weave-installer-macos.pkg
            release/Weave-project-macos.app
            release/Weave-windows.zip
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_RELEASE == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
