[package]
name = "weave"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "MayaFlux installation and project tool"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
rfd = "=0.17.2"
serde = "=1.0.229"
serde_json = "=1.0.154"
slint = { version = "=1.18.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[build-dependencies]
slint-build = "=1.18.0"
